apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: call-api-from-file
spec:
  params:
    - name: test-id
    - name: data-file-name
    - name: namespace-name
  workspaces:
    - name: source
  steps:
    - name: execute-from-yaml
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/bin/bash
        # 1. クラスタのベースドメインを自動取得
        OPENSHIFT_DOMAIN=$(oc get ingresses.config/cluster -o jsonpath='{.spec.domain}')
        FILE_PATH="$(workspaces.source.path)/testcases/$(params.test-id)/data-entry/$(params.data-file-name)"
        
        if [ ! -f "$FILE_PATH" ]; then
          echo "❌ Data file not found: $FILE_PATH"
          exit 1
        fi

        # 2. YAMLからパラメータを抽出
        API_NAME=$(grep 'api_name:' $FILE_PATH | sed 's/.*: "\(.*\)"/\1/')
        ENDPOINT_PATH=$(grep 'url_path:' $FILE_PATH | sed 's/.*: "\(.*\)"/\1/')
        METHOD=$(grep 'method:' $FILE_PATH | sed 's/.*: "\(.*\)"/\1/')
        OK_CODE=$(grep 'ok_code:' $FILE_PATH | sed 's/.*: "\(.*\)"/\1/')
        
        # 3. URLの組み立て
        FULL_URL="https://${API_NAME}-$(params.namespace-name).${OPENSHIFT_DOMAIN}${ENDPOINT_PATH}"

        # 4. 疎通確認
        echo "--- Connectivity Wait ---"
        echo "📡 Testing: ${FULL_URL}"

        ATTEMPTS=0
        MAX_ATTEMPTS=12
        while true; do
          # ステータスコードを取得
          HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "${FULL_URL}")
          
          # 判定ロジックのアップデート
          # 200(OK) はもちろん、405(Method Not Allowed) も「アプリが応答した」ので成功とみなす
          if [[ "$HTTP_STATUS" == "200" || "$HTTP_STATUS" == "405" ]]; then
            echo "✅ Application is alive and responding! (Status: $HTTP_STATUS)"
            break
          fi

          # 401(Unauthorized) や 403(Forbidden) もアプリが返しているなら成功とみなしてOK
          if [[ "$HTTP_STATUS" == "401" || "$HTTP_STATUS" == "403" ]]; then
            echo "✅ Application is reachable (Security challenge received: $HTTP_STATUS)"
            break
          fi

          if [[ $ATTEMPTS -eq $MAX_ATTEMPTS ]]; then
            echo "❌ Timeout: Application is still returning $HTTP_STATUS"
            exit 1
          fi

          echo "⏳ Waiting for app... (Current Status: $HTTP_STATUS) - Attempt: $ATTEMPTS"
          sleep 10
          ATTEMPTS=$((ATTEMPTS + 1))
        done

        # 5. API投入
        echo "🚀 Starting data entry..."
        grep "\- '" $FILE_PATH | sed "s/  - '\(.*\)'/\1/" | while read -r JSON_DATA; do
          # 念のためここでも STATUS をクォートで囲む
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -k -X "${METHOD}" \
            -H "Content-Type: application/json" -d "${JSON_DATA}" "${FULL_URL}")
          
          if [[ "$STATUS" == "$OK_CODE" ]]; then
            echo "✅ Data sent: $STATUS"
          else
            echo "❌ Failed to send data: $STATUS"
            exit 1
          fi
        done
