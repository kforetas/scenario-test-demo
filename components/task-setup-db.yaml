apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: set-up-db
spec:
  params:
    - name: test-id
      description: "テストID"
    - name: target-ns
      description: "DBが稼働している名前空間"
    - name: db-service-name
      default: "postgresql"
    - name: configmap-name
      default: "database-params"
  workspaces:
    - name: source
  steps:
    - name: run-psql
      image: quay.io/openshift/origin-cli:latest
      script: |
        # 1. ConfigMapから接続情報を取得
        echo "Fetching DB parameters from ConfigMap: $(params.configmap-name)"
        
        DB_USER=$(oc get configmap $(params.configmap-name) -n $(params.target-ns) -o jsonpath='{.data.DB_USER}')
        DB_NAME=$(oc get configmap $(params.configmap-name) -n $(params.target-ns) -o jsonpath='{.data.DB_NAME}')
        export PGPASSWORD=$(oc get configmap $(params.configmap-name) -n $(params.target-ns) -o jsonpath='{.data.DB_PASS}')

        # 2. SQLファイルのパス特定
        SQL_PATH="$(workspaces.source.path)/testcases/$(params.test-id)/sql/init.sql"
        
        # 3. Pod名の取得
        POD_NAME=$(oc get pod -l app=$(params.db-service-name) -n $(params.target-ns) -o jsonpath='{.items[0].metadata.name}')

        # 4. SQLの実行
        # PGPASSWORD環境変数を設定しておくと、psqlはパスワード入力をスキップします
        echo "🚀 Executing SQL on ${POD_NAME} as user ${DB_USER}..."
        
        cat ${SQL_PATH} | oc exec -i ${POD_NAME} -n $(params.target-ns) -- \
          psql -U ${DB_USER} -d ${DB_NAME}

        # セキュリティのため環境変数をクリア
        unset PGPASSWORD
